<div class="card search-card p-4 mb-5">

    <div class="section-title">

        🔍 書籍輸入

    </div>

    <div class="row g-3">

        <div class="col-lg-6">

            <input
                type="text"
                id="urlInput"
                class="form-control input-box"
                placeholder="請輸入博客來網址"
            >

        </div>

        <div class="col-lg-4">

            <select
                id="presetSelect"
                class="form-select input-box"
            >

                <option value="">

                    請選擇書籍

                </option>

                <option value="被討厭的勇氣">

                    被討厭的勇氣

                </option>

                <option value="原子習慣">

                    原子習慣

                </option>

                <option value="解憂雜貨店">

                    解憂雜貨店

                </option>

                <option value="牧羊少年奇幻之旅">

                    牧羊少年奇幻之旅

                </option>

                <option value="底層邏輯：看清這個世界的底牌">

                    底層邏輯：看清這個世界的底牌

                </option>

            </select>

        </div>

        <div class="col-lg-2">

            <button
                class="analyze-btn"
                onclick="analyzeBook()"
            >

                開始分析

            </button>

        </div>

    </div>

</div>
